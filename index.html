<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexus AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#f6f6f3;
color:#111;
overflow-x:hidden;
}

header{
position:fixed;
top:0;
left:0;
width:100%;
padding:25px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(246,246,243,.9);
backdrop-filter:blur(15px);
z-index:1000;
}

.logo{
font-size:32px;
font-weight:900;
}

.logo span{
color:#b8ff3b;
}

nav a{
text-decoration:none;
color:#111;
margin-left:30px;
font-weight:600;
}

.hero{
min-height:100vh;
padding:140px 8% 80px;
display:grid;
grid-template-columns:1.1fr 1fr;
gap:60px;
align-items:center;
}

.tag{
display:inline-block;
padding:10px 18px;
border-radius:30px;
background:white;
margin-bottom:25px;
font-weight:600;
}

.hero h1{
font-size:92px;
line-height:.92;
font-weight:900;
letter-spacing:-4px;
margin-bottom:25px;
}

.highlight{
color:#b8ff3b;
}

.hero p{
font-size:20px;
line-height:1.8;
color:#555;
max-width:650px;
margin-bottom:35px;
}

.btns{
display:flex;
gap:15px;
}

.btn{
padding:18px 35px;
border-radius:60px;
text-decoration:none;
font-weight:700;
}

.btn-dark{
background:#111;
color:white;
}

.btn-green{
background:#b8ff3b;
color:#111;
}

.hero-image{
height:700px;
background:white;
border-radius:40px;
overflow:hidden;
box-shadow:0 20px 60px rgba(0,0,0,.08);
}

.hero-image img{
width:100%;
height:100%;
object-fit:cover;
}

.stats{
padding:50px 8% 100px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px;
}

.stat{
background:white;
padding:40px;
border-radius:25px;
}

.stat h2{
font-size:60px;
margin-bottom:10px;
}

.stat p{
color:#666;
}

@media(max-width:900px){

.hero{
grid-template-columns:1fr;
}

.hero h1{
font-size:58px;
}

.hero-image{
height:450px;
}

.stats{
grid-template-columns:1fr;
}

nav{
display:none;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
Nexus <span>AI</span>
</div>

<nav>
<a href="#">Home</a>
<a href="#">Work</a>
<a href="#">Services</a>
<a href="#">About</a>
<a href="#">Contact</a>
</nav>

</header>

<section class="hero">

<div>

<div class="tag">
AI Content Agency
</div>

<h1>
Content That<br>
Makes Brands<br>
<span class="highlight">Stand Out</span>
</h1>

<p>
Nexus AI creates ad creatives, UGC content,
reels, social media designs and marketing
assets for modern brands.
</p>

<div class="btns">

<a href="#" class="btn btn-dark">
View Work
</a>

<a href="https://wa.me/918955147302"
class="btn btn-green">
WhatsApp
</a>

</div>

</div>

<div class="hero-image">

<img src="IMG20220920125625 (2) - Copy.jpg">

</div>

</section>

<section class="stats">

<div class="stat">
<h2>50+</h2>
<p>Creative Projects</p>
</div>

<div class="stat">
<h2>10M+</h2>
<p>Views Generated</p>
</div>

<div class="stat">
<h2>24h</h2>
<p>Fast Delivery</p>
</div>

</section>
